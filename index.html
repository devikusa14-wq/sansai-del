<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON // Developer Workbench</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --bg-card: #0d1117;
            --bg-input: #161b22;
            --border: #30363d;
            --primary: #ff2a4b;
            --primary-glow: rgba(255, 42, 75, 0.35);
            --cyan: #00f0ff;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --code-bg: #05070a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* TOP NAVIGATION */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            color: var(--primary);
            font-size: 1.3rem;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: #e0223e;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        /* MAIN APPS CONTAINER */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* SIDEBAR HISTORY */
        .sidebar {
            width: 240px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 12px;
            z-index: 5;
            transition: transform 0.3s ease;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                height: 100%;
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            overflow-y: auto;
        }

        .history-item {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .history-item:hover {
            color: var(--text-main);
            border-color: var(--primary);
        }

        /* MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }

        /* CHAT WINDOW */
        .chat-history {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .avatar-ultron {
            background: rgba(255, 42, 75, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .avatar-user {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid var(--cyan);
            color: var(--cyan);
        }

        .msg-content {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .msg-content p {
            margin-bottom: 8px;
        }
        
        .msg-content p:last-child {
            margin-bottom: 0;
        }

        /* CODE BLOCK STYLING */
        .code-container {
            margin: 10px 0;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .code-header {
            background: #11161d;
            padding: 6px 10px;
            font-size: 0.7rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .code-actions {
            display: flex;
            gap: 6px;
        }

        .code-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .code-btn:hover {
            color: var(--text-main);
        }

        pre {
            padding: 10px;
            overflow-x: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.82rem;
            color: #e6edf3;
        }

        /* CHAT INPUT AREA */
        .input-panel {
            padding: 12px 16px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }

        .input-box {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            gap: 8px;
        }

        textarea {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            padding: 10px 14px;
            font-size: 0.9rem;
            resize: none;
            height: 48px;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        /* MODALS & PANELS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 450px;
            max-width: 90%;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 6px;
            outline: none;
        }

        /* LIVE CODE SANDBOX PANEL */
        .sandbox-panel {
            width: 45%;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .sandbox-panel {
                position: absolute;
                width: 100%;
                height: 100%;
                z-index: 20;
            }
        }

        .sandbox-panel.hidden {
            display: none;
        }

        .sandbox-header {
            padding: 10px 14px;
            background: #11161d;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <!-- TOP HEADER -->
    <header>
        <div class="brand">
            <button class="btn" style="padding: 4px 8px;" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <i class="fa-solid fa-robot brand-icon"></i>
            <span class="brand-title">Ultron</span>
        </div>
        <div class="header-actions">
            <button class="btn" id="toggleSandboxBtn" onclick="toggleSandbox()">
                <i class="fa-solid fa-code"></i> Preview
            </button>
            <button class="btn" onclick="openSettings()">
                <i class="fa-solid fa-gear"></i> Settings
            </button>
        </div>
    </header>

    <!-- MAIN INTERFACE -->
    <div class="app-container">

        <!-- LEFT SIDEBAR: CHAT HISTORY -->
        <div class="sidebar" id="sidebar">
            <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Chat History</span>
                <button class="code-btn" style="color: var(--primary);" onclick="clearHistory()">Clear</button>
            </div>
            <div class="history-list" id="historyList">
                <!-- History items load here -->
            </div>
        </div>

        <!-- MAIN CHAT AREA -->
        <div class="main-content">
            <div class="chat-history" id="chatHistory">
                <!-- Messages load here -->
            </div>

            <!-- CHAT INPUT -->
            <div class="input-panel">
                <div class="input-box">
                    <textarea id="userInput" placeholder="Ask Ultron..." onkeydown="handleKeyPress(event)"></textarea>
                    <button class="btn btn-primary" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- RIGHT SIDEBAR: LIVE CODE SANDBOX -->
        <div class="sandbox-panel hidden" id="sandboxPanel">
            <div class="sandbox-header">
                <span style="font-size: 0.85rem; font-weight: 700; color: var(--cyan);">
                    <i class="fa-solid fa-desktop"></i> Preview Output
                </span>
                <button class="btn" style="padding: 4px 8px;" onclick="toggleSandbox()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <iframe id="sandboxFrame"></iframe>
        </div>

    </div>

    <!-- SETTINGS MODAL -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="color: var(--text-main); font-size: 1rem;"><i class="fa-solid fa-sliders"></i> Configuration</h3>
                <button class="btn" onclick="closeSettings()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="apiKeyInput" placeholder="Enter API Key...">
            </div>
            <div class="form-group">
                <label>AI Model</label>
                <select id="modelSelect">
                    <option value="openai/gpt-oss-120b">Model Primary</option>
                    <option value="llama-3.3-70b-versatile">Model Secondary</option>
                </select>
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('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') || '';
        let selectedModel = localStorage.getItem('ULTRON_MODEL') || 'openai/gpt-oss-120b';
        let chatMessages = JSON.parse(localStorage.getItem('ULTRON_CHAT_HISTORY')) || [];

        document.getElementById('apiKeyInput').value = apiKey;
        document.getElementById('modelSelect').value = selectedModel;

        window.onload = function() {
            if (chatMessages.length === 0) {
                appendMessage('ultron', '<strong>ULTRON ONLINE.</strong><br>Ask Ultron anything. Ready to process code, build layouts, or handle developer tasks.', false);
            } else {
                chatMessages.forEach(msg => {
                    appendMessage(msg.sender, msg.content, false);
                });
            }
            renderHistorySidebar();
        };

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        }

        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            selectedModel = document.getElementById('modelSelect').value;
            localStorage.setItem('ULTRON_API_KEY', apiKey);
            localStorage.setItem('ULTRON_MODEL', selectedModel);
            closeSettings();
            alert('Settings saved successfully.');
        }

        function toggleSandbox() {
            const panel = document.getElementById('sandboxPanel');
            panel.classList.toggle('hidden');
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text, true);
            input.value = '';

            const loadingId = appendMessage('ultron', '<i>Ultron is processing...</i>', false);

            if (apiKey) {
                try {
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: selectedModel,
                            messages: [
                                { role: 'system', content: 'You are Ultron, an advanced AI software developer assistant. Produce clean code, markdown blocks, and precise technical solutions.' },
                                { role: 'user', content: text }
                            ]
                        })
                    });

                    const data = await response.json();
                    document.getElementById(loadingId).remove();
                    chatMessages.pop();

                    if (data.choices && data.choices[0]) {
                        appendMessage('ultron', data.choices[0].message.content, true);
                    } else if (data.error) {
                        appendMessage('ultron', 'System Error: ' + data.error.message, true);
                    } else {
                        appendMessage('ultron', 'Error: Unable to parse response.', true);
                    }
                } catch (err) {
                    document.getElementById(loadingId).remove();
                    chatMessages.pop();
                    appendMessage('ultron', 'Connection Error: ' + err.message, true);
                }
            } else {
                setTimeout(() => {
                    document.getElementById(loadingId).remove();
                    chatMessages.pop();
                    let simResponse = `### Ultron Response\n\nProcessed your request: **"${text}"** successfully.\n\nConfigure your API Key in Settings to run live model completions.`;
                    appendMessage('ultron', simResponse, true);
                }, 1000);
            }
        }

        function appendMessage(sender, content, saveToStorage) {
            const history = document.getElementById('chatHistory');
            const msgId = 'msg-' + Date.now() + Math.random();

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.id = msgId;

            const isUltron = sender === 'ultron';
            const avatarHtml = isUltron 
                ? `<div class="avatar avatar-ultron"><i class="fa-solid fa-robot"></i></div>` 
                : `<div class="avatar avatar-user"><i class="fa-solid fa-user"></i></div>`;

            let formattedContent = formatMarkdown(content);

            messageDiv.innerHTML = `
                ${avatarHtml}
                <div class="msg-content">
                    ${formattedContent}
                </div>
            `;

            history.appendChild(messageDiv);
            history.scrollTop = history.scrollHeight;

            if (saveToStorage) {
                chatMessages.push({ sender, content });
                localStorage.setItem('ULTRON_CHAT_HISTORY', JSON.stringify(chatMessages));
                renderHistorySidebar();
            }

            return msgId;
        }

        function renderHistorySidebar() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            
            const userMsgs = chatMessages.filter(m => m.sender === 'user');
            
            if (userMsgs.length === 0) {
                list.innerHTML = '<div style="font-size:0.75rem; color:var(--text-muted); padding:4px;">No recent history</div>';
                return;
            }

            userMsgs.forEach((msg) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = msg.content;
                list.appendChild(item);
            });
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear chat history?')) {
                localStorage.removeItem('ULTRON_CHAT_HISTORY');
                chatMessages = [];
                document.getElementById('chatHistory').innerHTML = '';
                appendMessage('ultron', '<strong>ULTRON ONLINE.</strong><br>History cleared. Ready for new instructions.', false);
                renderHistorySidebar();
            }
        }

        function formatMarkdown(text) {
            return text.replace(/```(html|css|js|javascript|yaml)?([\s\S]*?)```/g, function(match, lang, code) {
                const cleanCode = code.trim();
                const isHtml = lang === 'html';
                const codeId = 'code-' + Math.random().toString(36).substring(2, 9);
                
                window[codeId] = cleanCode;

                return `
                    <div class="code-container">
                        <div class="code-header">
                            <span>${(lang || 'code').toUpperCase()}</span>
                            <div class="code-actions">
                                ${isHtml ? `<button class="code-btn" onclick="runInSandbox('${codeId}')"><i class="fa-solid fa-play"></i> Preview</button>` : ''}
                                <button class="code-btn" onclick="copyCode('${codeId}')"><i class="fa-solid fa-copy"></i> Copy</button>
                            </div>
                        </div>
                        <pre id="${codeId}-text">${escapeHtml(cleanCode)}</pre>
                    </div>
                `;
            }).replace(/\n/g, '<br>');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function copyCode(codeId) {
            const codeText = window[codeId] || document.getElementById(codeId + '-text').innerText;
            navigator.clipboard.writeText(codeText);
            alert('Code copied to clipboard!');
        }

        function runInSandbox(codeId) {
            const code = window[codeId];
            const sandboxPanel = document.getElementById('sandboxPanel');
            const iframe = document.getElementById('sandboxFrame');
            
            sandboxPanel.classList.remove('hidden');
            iframe.srcdoc = code;
        }
    </script>
</body>
</html>
